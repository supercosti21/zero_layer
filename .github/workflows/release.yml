name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            artifact: zl-x86_64-unknown-linux-gnu
          - target: aarch64-unknown-linux-gnu
            artifact: zl-aarch64-unknown-linux-gnu
            cross: true
          - target: x86_64-unknown-linux-musl
            artifact: zl-x86_64-unknown-linux-musl
            cross: true
          - target: aarch64-unknown-linux-musl
            artifact: zl-aarch64-unknown-linux-musl
            cross: true

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross
        if: matrix.cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build (native)
        if: ${{ !matrix.cross }}
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build (cross)
        if: matrix.cross
        run: cross build --release --target ${{ matrix.target }}

      - name: Rename binary
        run: cp target/${{ matrix.target }}/release/zl ${{ matrix.artifact }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate checksums
        run: |
          cd artifacts
          for dir in */; do
            cd "$dir"
            sha256sum * >> ../SHA256SUMS.txt
            cd ..
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/zl-x86_64-unknown-linux-gnu/zl-x86_64-unknown-linux-gnu
            artifacts/aarch64-unknown-linux-gnu/zl-aarch64-unknown-linux-gnu
            artifacts/zl-x86_64-unknown-linux-musl/zl-x86_64-unknown-linux-musl
            artifacts/zl-aarch64-unknown-linux-musl/zl-aarch64-unknown-linux-musl
            artifacts/SHA256SUMS.txt
