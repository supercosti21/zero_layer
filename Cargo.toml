[package]
name = "zero_layer"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Universal Linux package manager with native binary translation"

[[bin]]
name = "zl"
path = "src/main.rs"

[dependencies]
# CLI
clap = { version = "4", features = ["derive"] }
clap_complete = "4"

# ELF analysis (read-only parsing)
goblin = "0.10"

# ELF patching (set interpreter, rpath, runpath)
elb = "0.4"

# Dependency graph
petgraph = "0.8"

# Database (embedded key-value, pure Rust, ACID)
redb = "2"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"

# HTTP client
reqwest = { version = "0.13", features = ["blocking", "json"] }

# Compression/archive
tar = "0.4"
zstd = "0.13"
flate2 = "1"

# Error handling
thiserror = "2"
anyhow = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Progress bars and user interaction
indicatif = "0.18"
dialoguer = "0.12"
console = "0.16"

# File hashing
sha2 = "0.11"

# Filesystem utilities
walkdir = "2"
tempfile = "3"
dirs = "6"

# System detection
libc = "0.2"

# Plugin: APT (.deb extraction)
ar = "0.9"
bzip2 = "0.6"

# Plugin: GitHub Releases (.zip extraction)
zip = "8"

# Plugin: APT + GitHub (XZ decompression for .tar.xz and Packages.xz)
xz2 = "0.1"

# Plugin: DNF/Zypper (RPM repodata XML parsing)
quick-xml = "0.41"

# Plugin: DNF/Zypper (RPM cpio extraction)
cpio = "0.4"
